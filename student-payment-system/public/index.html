<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سیستم مدیریت پرداخت دانشجویی</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/persian-datepicker@1.2.0/dist/css/persian-datepicker.min.css">
    <style>
        :root {
            --dark-blue-primary: #0a192f;
            --dark-blue-secondary: #112240;
            --dark-blue-light: #233554;
            --dark-blue-accent: #3d5a80;
            --blue-highlight: #64ffda;
            --text-primary: #e6f1ff;
            --text-secondary: #8892b0;
            --success: #64ffda;
            --error: #ff6b6b;
            --warning: #ffd93d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background: linear-gradient(135deg, var(--dark-blue-primary) 0%, var(--dark-blue-secondary) 100%);
            color: var(--text-primary);
            min-height: 100vh;
            direction: rtl;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        header {
            background: rgba(17, 34, 64, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid var(--dark-blue-light);
            padding: 1rem 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--blue-highlight);
            text-shadow: 0 0 10px rgba(100, 255, 218, 0.3);
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
        }

        /* Buttons */
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--dark-blue-accent), var(--blue-highlight));
            color: var(--dark-blue-primary);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(100, 255, 218, 0.4);
        }

        .btn-secondary {
            background: transparent;
            border: 2px solid var(--blue-highlight);
            color: var(--blue-highlight);
        }

        .btn-secondary:hover {
            background: var(--blue-highlight);
            color: var(--dark-blue-primary);
        }

        .btn-danger {
            background: var(--error);
            color: white;
        }

        .btn-danger:hover {
            background: #ff5252;
        }

        /* Cards */
        .card {
            background: rgba(17, 34, 64, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            margin: 20px 0;
            border: 1px solid var(--dark-blue-light);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .card h2, .card h3 {
            color: var(--blue-highlight);
            margin-bottom: 20px;
            font-size: 1.3rem;
        }

        /* Forms */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            background: var(--dark-blue-primary);
            border: 2px solid var(--dark-blue-light);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: 'Vazirmatn', sans-serif;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--blue-highlight);
            box-shadow: 0 0 10px rgba(100, 255, 218, 0.2);
        }

        select.form-control {
            cursor: pointer;
        }

        /* Login/Register Pages */
        .auth-container {
            max-width: 450px;
            margin: 100px auto;
        }

        .auth-container .card {
            text-align: center;
        }

        /* Dashboard */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, var(--dark-blue-accent), var(--dark-blue-light));
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            border: 1px solid var(--blue-highlight);
        }

        .stat-card .value {
            font-size: 2rem;
            font-weight: bold;
            color: var(--blue-highlight);
            margin: 10px 0;
        }

        .stat-card .label {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* Table */
        .table-container {
            overflow-x: auto;
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--dark-blue-primary);
            border-radius: 10px;
            overflow: hidden;
        }

        th, td {
            padding: 15px;
            text-align: right;
            border-bottom: 1px solid var(--dark-blue-light);
        }

        th {
            background: var(--dark-blue-accent);
            color: var(--blue-highlight);
            font-weight: 600;
        }

        tr:hover {
            background: var(--dark-blue-light);
        }

        /* Alerts */
        .alert {
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .alert-success {
            background: rgba(100, 255, 218, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
        }

        .alert-error {
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid var(--error);
            color: var(--error);
        }

        .alert-warning {
            background: rgba(255, 217, 61, 0.1);
            border: 1px solid var(--warning);
            color: var(--warning);
        }

        /* Hidden */
        .hidden {
            display: none !important;
        }

        /* File Upload */
        .file-upload {
            border: 2px dashed var(--dark-blue-light);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .file-upload:hover {
            border-color: var(--blue-highlight);
            background: rgba(100, 255, 218, 0.05);
        }

        .file-upload input[type="file"] {
            display: none;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: 15px;
            }

            .nav-buttons {
                flex-wrap: wrap;
                justify-content: center;
            }

            .dashboard-grid {
                grid-template-columns: 1fr;
            }

            table {
                font-size: 0.85rem;
            }

            th, td {
                padding: 10px;
            }
        }

        /* Loading Spinner */
        .spinner {
            border: 3px solid var(--dark-blue-light);
            border-top: 3px solid var(--blue-highlight);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Receipt Image Preview */
        .image-preview {
            max-width: 200px;
            max-height: 200px;
            border-radius: 8px;
            margin-top: 10px;
            border: 2px solid var(--dark-blue-light);
        }

        /* Search Filters */
        .filter-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        /* Badge */
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .badge-admin {
            background: var(--blue-highlight);
            color: var(--dark-blue-primary);
        }

        .badge-user {
            background: var(--text-secondary);
            color: var(--dark-blue-primary);
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo">💳 سیستم مدیریت پرداخت دانشجویی</div>
            <div class="nav-buttons" id="navButtons">
                <!-- Navigation buttons will be inserted here -->
            </div>
        </div>
    </header>

    <div class="container" id="app">
        <!-- Dynamic content will be rendered here -->
    </div>

    <script src="https://cdn.jsdelivr.net/npm/persian-date@1.1.0/persian-date.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/persian-datepicker@1.2.0/dist/js/persian-datepicker.min.js"></script>
    <script src="/app.js"></script>
</body>
</html>
